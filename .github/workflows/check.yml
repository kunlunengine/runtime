name: Check Rust

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
      types: [checks_requested]

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/registry
                  key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
            - name: Cache cargo git
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/git
                  key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
            - name: Validate JSC distribution manifest
              run: cargo xtask jsc-manifest validate
            - name: Test JSC artifact tooling
              run: |
                  bash -n distribution/jsc/scripts/*.sh
                  python3 -m unittest discover -s distribution/jsc/scripts/tests -v
            - name: Build
              run: cargo build
            - name: Check code formatting
              run: cargo fmt --all -- --check
            - name: Check code linting
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Run tests
              run: cargo test --workspace

    m0-macos:
        name: M0 macOS (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
                      uname: arm64
                    - arch: x64
                      runner: macos-15-intel
                      uname: x86_64
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Verify runner architecture
              run: test "$(uname -m)" = "${{ matrix.uname }}"
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/registry
                  key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
            - name: Cache cargo git
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/git
                  key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
            - name: Run workspace tests
              run: cargo test --workspace
            - name: Run runtime doctor
              run: cargo run -p kunlun-runtime -- doctor

    miri:
        name: Miri ownership invariants
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install nightly Rust with Miri
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: miri
            - name: Prepare Miri sysroot
              run: cargo +nightly miri setup
            - name: Check wrapper-owned invariants
              run: cargo +nightly miri test -p kunlun-jsc --lib
