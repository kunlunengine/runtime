name: Build pinned JSC for Linux

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jsc-linux.yml
      - Cargo.lock
      - Cargo.toml
      - crates/kunlun-jsc-sys/**
      - crates/kunlun-jsc/**
      - crates/kunlun-runtime/**
      - distribution/jsc/**
  workflow_dispatch:
    inputs:
      compare_rebuild:
        description: Build each target twice and require byte-identical archives
        required: true
        type: boolean
        default: true

concurrency:
  group: jsc-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            machine: aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Validate distribution tooling and native runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustup target add "$TARGET"
          cargo xtask jsc-manifest validate
          bash -n distribution/jsc/scripts/*.sh
          python3 -m unittest discover -s distribution/jsc/scripts/tests -v

      - name: Check out pinned WebKit source
        id: source
        shell: bash
        run: |
          revision=$(jq -er '.source.revision' distribution/jsc/manifest.json)
          repository=$(jq -er '.source.repository' distribution/jsc/manifest.json)
          source_root=$(mktemp -d "$RUNNER_TEMP/kunlun-webkit-${TARGET}-XXXXXX")
          git -C "$source_root" init
          git -C "$source_root" remote add origin "$repository"
          git -C "$source_root" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$source_root" sparse-checkout init --cone
          git -C "$source_root" sparse-checkout set \
            JSTests Source/JavaScriptCore Source/ThirdParty Source/WTF Source/bmalloc Source/cmake \
            Tools/Profiling Tools/Scripts Tools/TestWebKitAPI Tools/ccache Tools/clangd
          git -C "$source_root" checkout --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$revision"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"

      - name: Build, package, and verify without build-time network
        id: build
        shell: bash
        run: |
          output_root=$(mktemp -d "$RUNNER_TEMP/kunlun-output-${TARGET}-XXXXXX")
          distribution/jsc/scripts/run-linux-container.sh \
            --target "$TARGET" \
            --webkit-root "${{ steps.source.outputs.source_root }}" \
            --output "$output_root"

      - name: Run binding corpus against pinned artifact
        shell: bash
        env:
          KUNLUN_JSC_DIST_DIR: ${{ steps.build.outputs.staging }}
          LD_LIBRARY_PATH: ${{ steps.build.outputs.staging }}/lib
        run: |
          cargo test --workspace --target "$TARGET"
          cargo run -p kunlun-runtime --target "$TARGET" -- doctor \
            | tee "$RUNNER_TEMP/doctor-${TARGET}.txt"
          grep -Fqx 'distribution: pinned Kunlun JSC artifact' "$RUNNER_TEMP/doctor-${TARGET}.txt"
          grep -Fqx 'hermetic: true' "$RUNNER_TEMP/doctor-${TARGET}.txt"

      - name: Reclaim first-build intermediates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_rebuild }}
        shell: bash
        env:
          OUTPUT_ROOT: ${{ steps.build.outputs.output_root }}
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          case "$OUTPUT_ROOT" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$SOURCE_ROOT" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- \
            "$OUTPUT_ROOT/webkit-build" \
            "$OUTPUT_ROOT/native" \
            "$OUTPUT_ROOT/staging" \
            "$SOURCE_ROOT"

      - name: Check independent rebuild
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_rebuild }}
        shell: bash
        run: |
          revision=$(jq -er '.source.revision' distribution/jsc/manifest.json)
          repository=$(jq -er '.source.repository' distribution/jsc/manifest.json)
          source_root=$(mktemp -d "$RUNNER_TEMP/kunlun-webkit-rebuild-${TARGET}-XXXXXX")
          git -C "$source_root" init
          git -C "$source_root" remote add origin "$repository"
          git -C "$source_root" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$source_root" sparse-checkout init --cone
          git -C "$source_root" sparse-checkout set \
            JSTests Source/JavaScriptCore Source/ThirdParty Source/WTF Source/bmalloc Source/cmake \
            Tools/Profiling Tools/Scripts Tools/TestWebKitAPI Tools/ccache Tools/clangd
          git -C "$source_root" checkout --detach FETCH_HEAD
          output_root=$(mktemp -d "$RUNNER_TEMP/kunlun-rebuild-${TARGET}-XXXXXX")
          distribution/jsc/scripts/run-linux-container.sh \
            --target "$TARGET" \
            --webkit-root "$source_root" \
            --output "$output_root"
          archive_name=$(basename "${{ steps.build.outputs.archive }}")
          report="$(dirname "${{ steps.build.outputs.archive }}")/${archive_name%.tar.zst}.rebuild.json"
          python3 distribution/jsc/scripts/jsc_artifact.py compare \
            --first "${{ steps.build.outputs.archive }}" \
            --second "$output_root/artifacts/$archive_name" \
            --output "$report" \
            --require-identical
          echo "rebuild_report=$report" >> "$GITHUB_ENV"
          case "$output_root" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$source_root" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$output_root" "$source_root"

      - name: Generate signed SLSA provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - name: Preserve provenance bundle and checksums
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: evidence
        shell: bash
        run: |
          provenance_name=$(jq -er --arg target "$TARGET" \
            '.targets[] | select(.triple == $target) | .artifact.provenance.path | split("/")[-1]' \
            distribution/jsc/manifest.json)
          evidence_dir=$(dirname "${{ steps.build.outputs.archive }}")
          provenance="$evidence_dir/$provenance_name"
          cp "${{ steps.provenance.outputs.bundle-path }}" "$provenance"
          checksums="$evidence_dir/SHA256SUMS"
          (
            cd "$evidence_dir"
            sha256sum \
              "$(basename "${{ steps.build.outputs.archive }}")" \
              "$(basename "${{ steps.build.outputs.sbom }}")" \
              "$provenance_name" > SHA256SUMS
          )
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"

      - name: Attest SPDX SBOM
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}
          sbom-path: ${{ steps.build.outputs.sbom }}

      - name: Upload audited artifact set
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kunlun-jsc-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.sbom }}
            ${{ steps.evidence.outputs.provenance }}
            ${{ steps.evidence.outputs.checksums }}
            ${{ env.rebuild_report }}
