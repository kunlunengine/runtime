name: M2 exit gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      compare_rebuild:
        description: 'Release validation: independently rebuild all four artifacts'
        type: boolean
        default: true
        required: true

concurrency:
  group: m2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/jsc-macos.yml
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      compare_rebuild: ${{ github.event_name == 'schedule' || inputs.compare_rebuild == true }}

  linux:
    uses: ./.github/workflows/jsc-linux.yml
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      compare_rebuild: ${{ github.event_name == 'schedule' || inputs.compare_rebuild == true }}

  miri:
    name: Miri ownership invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust with Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-09-01
          components: miri
      - name: Check Rust-owned invariants without native JSC
        shell: bash
        run: |
          cargo +nightly-2026-09-01 miri setup
          cargo +nightly-2026-09-01 miri test --locked -p xtask jsc_ownership \
            2>&1 | tee "$RUNNER_TEMP/miri-ownership.txt"
          cargo +nightly-2026-09-01 miri test --locked -p xtask jsc_rejection_ledger \
            2>&1 | tee "$RUNNER_TEMP/miri-rejections.txt"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/miri-ownership.txt"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/miri-rejections.txt"
      - name: Upload Miri evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-miri
          path: ${{ runner.temp }}/miri-*.txt
          if-no-files-found: error
          retention-days: 30

  gate:
    name: M2 required gate
    if: ${{ always() }}
    needs: [macos, linux, miri]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject failed, cancelled, or skipped ladder steps
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MIRI_RESULT: ${{ needs.miri.result }}
        run: |
          test "$MACOS_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$MIRI_RESULT" = success
      - name: Download this run's evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: m2-*
          path: ${{ runner.temp }}/m2-evidence
      - name: Require all four platforms at the exact reviewed commit
        run: |
          python3 distribution/jsc/scripts/m2_gate.py summarize \
            --evidence "$RUNNER_TEMP/m2-evidence" --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/m2-summary.md"
          cat "$RUNNER_TEMP/m2-summary.md" >> "$GITHUB_STEP_SUMMARY"
