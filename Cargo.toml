[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kunlunengine/runtime"

[workspace.dependencies]
cap-std = "4.0.3"
kunlun-jsc = { path = "crates/kunlun-jsc", version = "0.1.0", default-features = false }
kunlun-jsc-sys = { path = "crates/kunlun-jsc-sys", version = "0.1.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["fs", "net", "rt", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
