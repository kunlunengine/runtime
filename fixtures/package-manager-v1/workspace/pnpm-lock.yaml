lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      '@fixture/shared':
        specifier: workspace:*
        version: link:packages/shared
      ui:
        specifier: ^1.0.0
        version: 1.0.0(react@18.0.0)
    devDependencies:
      tool:
        specifier: ~1.0.0
        version: 1.0.0(extra@1.0.0(inner@1.0.0))
    optionalDependencies:
      platform:
        specifier: 1.0.0
        version: 1.0.0
  packages/app:
    dependencies:
      '@fixture/shared':
        specifier: workspace:^
        version: link:../shared
  packages/shared:
    dependencies:
      leaf:
        specifier: ^1.0.0
        version: 1.1.0

packages:
  extra@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
    peerDependencies:
      inner: ^1.0.0
  inner@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
  leaf@1.1.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
  loop-a@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
  loop-b@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
  platform@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
    os: [darwin, linux]
    cpu: [arm64, x64]
    libc: [glibc]
  react@18.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
    engines: {node: '>=18'}
  tool@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
    hasBin: true
    peerDependencies:
      extra: ^1.0.0
  ui@1.0.0:
    resolution: {integrity: sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==}
    peerDependencies:
      react: ^18.0.0

snapshots:
  extra@1.0.0(inner@1.0.0):
    dependencies:
      inner: 1.0.0
  inner@1.0.0: {}
  leaf@1.1.0: {}
  loop-a@1.0.0:
    dependencies:
      loop-b: 1.0.0
  loop-b@1.0.0:
    dependencies:
      loop-a: 1.0.0
  platform@1.0.0:
    optional: true
  react@18.0.0: {}
  tool@1.0.0(extra@1.0.0(inner@1.0.0)):
    dependencies:
      extra: 1.0.0(inner@1.0.0)
      loop-a: 1.0.0
  ui@1.0.0(react@18.0.0):
    dependencies:
      leaf: 1.1.0
      react: 18.0.0
